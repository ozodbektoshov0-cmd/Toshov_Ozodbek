<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rang asbobi | Toshov Ozodbek</title>
  <meta name="description" content="HEX, RGB va HSL formatlarini o'zgartiring va rang tuslarini oling.">
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body data-page="tools" data-root="../" data-tool="color">
  <main id="main" class="container">
    <div class="tool-head" id="tool-head"></div>
    <div class="grid2">
      <div class="panel">
        <div class="field"><label for="pick">Rang tanlang</label><input type="color" id="pick" value="#2ec4b6"></div>
        <div class="field"><label for="hex">HEX</label><input id="hex" type="text" value="#2ec4b6" maxlength="7" spellcheck="false"></div>
        <div class="field"><label for="rgb">RGB</label><input id="rgb" type="text" spellcheck="false" placeholder="rgb(46, 196, 182)"></div>
        <div class="field"><label for="hsl">HSL</label><input id="hsl" type="text" spellcheck="false" placeholder="hsl(174, 62%, 47%)"></div>
        <p id="err" class="msg-err" role="alert"></p>
        <div class="row"><button class="btn ghost" id="c-hex" type="button">HEX nusxalash</button><button class="btn ghost" id="c-rgb" type="button">RGB nusxalash</button><button class="btn ghost" id="c-hsl" type="button">HSL nusxalash</button></div>
      </div>
      <div class="panel">
        <div class="swatch" id="sw"></div>
        <p style="margin-top:12px" class="muted" id="contrast"></p>
        <h3>Tuslar (qoraroqdan yorug‘roqqa)</h3>
        <div class="shades" id="shades"></div>
        <p class="muted" style="margin-top:8px">Tusga bosing, HEX nusxalanadi.</p>
      </div>
    </div>
    <div id="related" class="related"></div>
  </main>
  <script src="../assets/app.js"></script>
  <script>
  (function () {
    var $ = function (id) { return document.getElementById(id); };
    function hex2rgb(h) { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(function (c) { return c + c; }).join(''); if (!/^[0-9a-f]{6}$/i.test(h)) return null; return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; }
    function rgb2hex(r) { return '#' + r.map(function (v) { return ('0' + Math.round(v).toString(16)).slice(-2); }).join(''); }
    function rgb2hsl(r) {
      var R = r[0] / 255, G = r[1] / 255, B = r[2] / 255, mx = Math.max(R, G, B), mn = Math.min(R, G, B), h = 0, s = 0, l = (mx + mn) / 2, d = mx - mn;
      if (d) { s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn); h = mx === R ? (G - B) / d + (G < B ? 6 : 0) : mx === G ? (B - R) / d + 2 : (R - G) / d + 4; h *= 60; }
      return [Math.round(h), Math.round(s * 100), Math.round(l * 100)];
    }
    function hsl2rgb(h, s, l) {
      s /= 100; l /= 100; var k = function (n) { return (n + h / 30) % 12; }, a = s * Math.min(l, 1 - l);
      var f = function (n) { return l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1))); };
      return [f(0) * 255, f(8) * 255, f(4) * 255];
    }
    function lum(r) { var c = r.map(function (v) { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }); return .2126 * c[0] + .7152 * c[1] + .0722 * c[2]; }
    function ratio(a, b) { var x = lum(a), y = lum(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); }

    var cur = [46, 196, 182];
    function show(skip) {
      var hex = rgb2hex(cur), hsl = rgb2hsl(cur);
      $('pick').value = hex; $('sw').style.background = hex;
      if (skip !== 'hex') $('hex').value = hex;
      if (skip !== 'rgb') $('rgb').value = 'rgb(' + cur.map(Math.round).join(', ') + ')';
      if (skip !== 'hsl') $('hsl').value = 'hsl(' + hsl[0] + ', ' + hsl[1] + '%, ' + hsl[2] + '%)';
      var w = ratio(cur, [255, 255, 255]), b = ratio(cur, [0, 0, 0]);
      $('contrast').textContent = 'Oq matn bilan kontrast: ' + w.toFixed(2) + ':1. Qora matn bilan: ' + b.toFixed(2) + ':1. ' + (Math.max(w, b) >= 4.5 ? 'Oddiy matn uchun yetarli.' : 'Matn uchun kontrast past.');
      var html = '';
      for (var i = 1; i <= 9; i++) { var c = rgb2hex(hsl2rgb(hsl[0], hsl[1], i * 10)); html += '<div role="button" tabindex="0" data-c="' + c + '" style="background:' + c + '" title="' + c + '" aria-label="' + c + '"></div>'; }
      $('shades').innerHTML = html; $('err').textContent = '';
    }
    $('pick').addEventListener('input', function () { cur = hex2rgb(this.value); show(); });
    $('hex').addEventListener('input', function () { var r = hex2rgb(this.value.trim()); if (r) { cur = r; show('hex'); } else $('err').textContent = 'HEX noto‘g‘ri, masalan: #2ec4b6'; });
    $('rgb').addEventListener('input', function () { var m = this.value.match(/(\d+)\D+(\d+)\D+(\d+)/); if (m && m.slice(1).every(function (v) { return +v <= 255; })) { cur = [+m[1], +m[2], +m[3]]; show('rgb'); } else $('err').textContent = 'RGB noto‘g‘ri, masalan: rgb(46, 196, 182)'; });
    $('hsl').addEventListener('input', function () { var m = this.value.match(/(\d+)\D+(\d+)\D+(\d+)/); if (m && +m[1] <= 360 && +m[2] <= 100 && +m[3] <= 100) { cur = hsl2rgb(+m[1], +m[2], +m[3]); show('hsl'); } else $('err').textContent = 'HSL noto‘g‘ri, masalan: hsl(174, 62%, 47%)'; });
    $('shades').addEventListener('click', function (e) { var d = e.target.closest('[data-c]'); if (d) TO.copyText(d.getAttribute('data-c')); });
    $('shades').addEventListener('keydown', function (e) { if (e.key === 'Enter') { var d = e.target.closest('[data-c]'); if (d) TO.copyText(d.getAttribute('data-c')); } });
    ['hex', 'rgb', 'hsl'].forEach(function (k) { $('c-' + k).addEventListener('click', function () { TO.copyText($(k).value); }); });
    show();
  })();
  </script>
</body>
</html>
