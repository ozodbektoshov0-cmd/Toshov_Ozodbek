<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>So'z va belgi sanagich | Toshov Ozodbek</title>
  <meta name="description" content="Matndagi so'z, belgi, gap va o'qish vaqtini hisoblang.">
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body data-page="tools" data-root="../" data-tool="words">
  <main id="main" class="container">
    <div class="tool-head" id="tool-head"></div>
    <div class="panel">
      <div class="field"><label for="txt">Matn</label><textarea id="txt" style="min-height:260px;font-family:var(--font-body)" placeholder="Matnni shu yerga yozing yoki qo‘ying"></textarea></div>
      <div class="grid3">
        <div class="stat"><b id="w">0</b><span>so‘z</span></div>
        <div class="stat"><b id="c">0</b><span>belgi (bo‘sh joy bilan)</span></div>
        <div class="stat"><b id="cn">0</b><span>belgi (bo‘sh joysiz)</span></div>
        <div class="stat"><b id="s">0</b><span>gap</span></div>
        <div class="stat"><b id="p">0</b><span>abzats</span></div>
        <div class="stat"><b id="r">0</b><span>o‘qish vaqti (daqiqa)</span></div>
      </div>
      <div class="row" style="margin-top:14px"><button class="btn ghost" id="clear" type="button">Tozalash</button></div>
    </div>
    <div id="related" class="related"></div>
  </main>
  <script src="../assets/app.js"></script>
  <script>
  (function () {
    var $ = function (id) { return document.getElementById(id); };
    function calc() {
      var t = $('txt').value, tt = t.trim();
      var words = tt ? tt.split(/\s+/).length : 0;
      $('w').textContent = words;
      $('c').textContent = t.length;
      $('cn').textContent = t.replace(/\s/g, '').length;
      $('s').textContent = tt ? (tt.match(/[^.!?]+[.!?]+(\s|$)|[^.!?]+$/g) || []).filter(function (x) { return x.trim(); }).length : 0;
      $('p').textContent = tt ? tt.split(/\n\s*\n|\n/).filter(function (x) { return x.trim(); }).length : 0;
      $('r').textContent = words ? Math.max(1, Math.round(words / 200)) : 0;
    }
    $('txt').addEventListener('input', calc);
    $('clear').addEventListener('click', function () { $('txt').value = ''; calc(); $('txt').focus(); });
  })();
  </script>
</body>
</html>
