<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rasm konvertori | Toshov Ozodbek</title>
  <meta name="description" content="JPG, PNG va WEBP formatlari orasida o'zgartiring va rasm hajmini kichraytiring.">
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body data-page="tools" data-root="../" data-tool="image-converter">
  <main id="main" class="container">
    <div class="tool-head" id="tool-head"></div>
    <div class="grid2">
      <div class="panel">
        <div class="field"><label for="file">Rasm tanlang</label><input id="file" type="file" accept="image/*"></div>
        <div class="grid2">
          <div class="field"><label for="fmt">Yangi format</label><select id="fmt"><option value="image/jpeg">JPG</option><option value="image/png">PNG</option><option value="image/webp">WEBP</option></select></div>
          <div class="field"><label for="w">Eni (px, ixtiyoriy)</label><input id="w" type="number" min="1" placeholder="Asl o‘lcham"></div>
        </div>
        <div class="field"><label for="q">Sifat: <span id="qv">85</span>%</label><input id="q" type="range" min="10" max="100" value="85"></div>
        <div class="row"><button class="btn" id="conv" type="button" disabled>O‘zgartirish</button><button class="btn gold" id="dl" type="button" disabled>Yuklab olish</button></div>
        <p id="info" class="muted" style="margin-top:12px"></p>
        <p id="err" class="msg-err" role="alert"></p>
      </div>
      <div class="panel">
        <div class="preview-box"><canvas id="cv" width="10" height="10" aria-label="Rasm ko‘rinishi"></canvas></div>
      </div>
    </div>
    <p class="muted" style="margin-top:14px">Rasm brauzeringizdan chiqmaydi. PNG formatida sifat sozlamasi ishlamaydi. JPG shaffoflikni qo‘llab-quvvatlamaydi, shaffof joylar oq bo‘ladi.</p>
    <div id="related" class="related"></div>
  </main>
  <script src="../assets/app.js"></script>
  <script>
  (function () {
    var $ = function (id) { return document.getElementById(id); };
    var img = null, name = 'rasm', blob = null;
    function size(b) { return b > 1048576 ? (b / 1048576).toFixed(2) + ' MB' : Math.round(b / 1024) + ' KB'; }
    $('q').addEventListener('input', function () { $('qv').textContent = this.value; });
    $('file').addEventListener('change', function () {
      var f = this.files[0]; $('err').textContent = ''; $('dl').disabled = true; blob = null;
      if (!f) return;
      if (f.type.indexOf('image/') !== 0) { $('err').textContent = 'Faqat rasm faylini tanlang.'; return; }
      name = f.name.replace(/\.[^.]+$/, '');
      var url = URL.createObjectURL(f), im = new Image();
      im.onload = function () {
        img = im; $('conv').disabled = false;
        $('info').textContent = 'Asl rasm: ' + im.naturalWidth + ' x ' + im.naturalHeight + ' px, ' + size(f.size);
        var c = $('cv'); c.width = im.naturalWidth; c.height = im.naturalHeight; c.getContext('2d').drawImage(im, 0, 0);
        URL.revokeObjectURL(url);
      };
      im.onerror = function () { $('err').textContent = 'Bu rasmni ochib bo‘lmadi.'; };
      im.src = url;
    });
    $('conv').addEventListener('click', function () {
      if (!img) return;
      var type = $('fmt').value, w = parseInt($('w').value, 10);
      var tw = w > 0 ? Math.min(w, 8000) : img.naturalWidth, th = Math.round(img.naturalHeight * tw / img.naturalWidth);
      var c = $('cv'); c.width = tw; c.height = th;
      var ctx = c.getContext('2d');
      if (type === 'image/jpeg') { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, tw, th); } else ctx.clearRect(0, 0, tw, th);
      ctx.drawImage(img, 0, 0, tw, th);
      c.toBlob(function (b) {
        if (!b || b.type !== type) { $('err').textContent = 'Brauzeringiz bu formatni qo‘llab-quvvatlamaydi. Boshqa format tanlang.'; return; }
        blob = b; $('dl').disabled = false; $('err').textContent = '';
        $('info').textContent = 'Yangi rasm: ' + tw + ' x ' + th + ' px, ' + size(b.size);
      }, type, parseInt($('q').value, 10) / 100);
    });
    $('dl').addEventListener('click', function () {
      if (!blob) return;
      var ext = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp' }[blob.type];
      TO.download(name + '.' + ext, blob);
    });
  })();
  </script>
</body>
</html>
