<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taymer va sekundomer | Toshov Ozodbek</title>
  <meta name="description" content="Orqaga sanash taymeri va sekundomer.">
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body data-page="tools" data-root="../" data-tool="timer">
  <main id="main" class="container">
    <div class="tool-head" id="tool-head"></div>
    <div class="grid2">
      <div class="panel">
        <h2>Taymer</h2>
        <div class="big-num" id="tdisp" aria-live="off">05:00</div>
        <div class="grid3" style="margin:12px 0">
          <div><label for="th">Soat</label><input id="th" type="number" min="0" max="99" value="0"></div>
          <div><label for="tm">Daqiqa</label><input id="tm" type="number" min="0" max="59" value="5"></div>
          <div><label for="ts">Soniya</label><input id="ts" type="number" min="0" max="59" value="0"></div>
        </div>
        <div class="row"><button class="btn" id="tstart" type="button">Boshlash</button><button class="btn ghost" id="tstop" type="button">To‘xtatish</button><button class="btn ghost" id="treset" type="button">Qayta o‘rnatish</button></div>
        <p id="tmsg" class="msg-ok" role="status"></p>
      </div>
      <div class="panel">
        <h2>Sekundomer</h2>
        <div class="big-num" id="sdisp">00:00.00</div>
        <div class="row" style="margin:12px 0"><button class="btn" id="sstart" type="button">Boshlash</button><button class="btn ghost" id="slap" type="button">Aylanish</button><button class="btn ghost" id="sreset" type="button">Qayta o‘rnatish</button></div>
        <ol id="laps" class="hist" style="padding-left:22px;list-style:decimal"></ol>
      </div>
    </div>
    <div id="related" class="related"></div>
  </main>
  <script src="../assets/app.js"></script>
  <script>
  (function () {
    var $ = function (id) { return document.getElementById(id); };
    function p2(n) { return (n < 10 ? '0' : '') + n; }
    function beep() {
      try {
        var C = window.AudioContext || window.webkitAudioContext, ctx = new C(), n = 0;
        (function one() {
          var o = ctx.createOscillator(), g = ctx.createGain();
          o.frequency.value = 880; o.connect(g); g.connect(ctx.destination); g.gain.value = 0.2;
          o.start(); setTimeout(function () { o.stop(); if (++n < 3) setTimeout(one, 200); }, 300);
        })();
      } catch (e) { /* ovoz ishlamasa ham mayli */ }
    }

    /* taymer */
    var tEnd = 0, tLeft = 0, tId = null;
    function readInputs() { return ((+$('th').value || 0) * 3600 + (+$('tm').value || 0) * 60 + (+$('ts').value || 0)) * 1000; }
    function showT(ms) { var s = Math.ceil(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); $('tdisp').textContent = (h ? p2(h) + ':' : '') + p2(m) + ':' + p2(s % 60); }
    showT(readInputs());
    ['th', 'tm', 'ts'].forEach(function (id) { $(id).addEventListener('input', function () { if (!tId) { tLeft = 0; showT(readInputs()); } }); });
    function tTick() {
      var left = tEnd - Date.now();
      if (left <= 0) { clearInterval(tId); tId = null; tLeft = 0; showT(0); $('tmsg').textContent = 'Vaqt tugadi!'; beep(); document.title = 'Vaqt tugadi | Toshov Ozodbek'; return; }
      tLeft = left; showT(left);
    }
    $('tstart').addEventListener('click', function () {
      if (tId) return;
      var ms = tLeft || readInputs();
      if (ms <= 0) { $('tmsg').textContent = ''; TO.toast('Avval vaqtni kiriting'); return; }
      $('tmsg').textContent = ''; tEnd = Date.now() + ms; tId = setInterval(tTick, 200); tTick();
    });
    $('tstop').addEventListener('click', function () { if (tId) { clearInterval(tId); tId = null; } });
    $('treset').addEventListener('click', function () { clearInterval(tId); tId = null; tLeft = 0; $('tmsg').textContent = ''; showT(readInputs()); });

    /* sekundomer */
    var sStart = 0, sAcc = 0, sId = null, laps = [];
    function showS(ms) { var cs = Math.floor(ms / 10), m = Math.floor(cs / 6000), s = Math.floor(cs % 6000 / 100); $('sdisp').textContent = p2(m) + ':' + p2(s) + '.' + p2(cs % 100); }
    function cur() { return sAcc + (sId ? Date.now() - sStart : 0); }
    $('sstart').addEventListener('click', function () {
      if (sId) { sAcc += Date.now() - sStart; clearInterval(sId); sId = null; $('sstart').textContent = 'Davom ettirish'; }
      else { sStart = Date.now(); sId = setInterval(function () { showS(cur()); }, 30); $('sstart').textContent = 'To‘xtatish'; }
    });
    $('slap').addEventListener('click', function () {
      if (!sId) return;
      laps.unshift($('sdisp').textContent);
      $('laps').innerHTML = laps.map(function (l) { return '<li>' + l + '</li>'; }).join('');
    });
    $('sreset').addEventListener('click', function () { clearInterval(sId); sId = null; sAcc = 0; laps = []; $('laps').innerHTML = ''; showS(0); $('sstart').textContent = 'Boshlash'; });
  })();
  </script>
</body>
</html>
