<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parol yaratuvchi | Toshov Ozodbek</title>
  <meta name="description" content="Kuchli tasodifiy parol yarating.">
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body data-page="tools" data-root="../" data-tool="password">
  <main id="main" class="container">
    <div class="tool-head" id="tool-head"></div>
    <div class="panel" style="max-width:720px">
      <div class="out" id="pw" style="font-size:1.2rem" aria-live="polite"></div>
      <div class="meter" style="margin:12px 0 4px"><i id="mt"></i></div>
      <p id="strength" class="muted"></p>
      <div class="field"><label for="len">Uzunlik: <span id="lv">16</span></label><input id="len" type="range" min="6" max="64" value="16"></div>
      <div class="check"><input id="lo" type="checkbox" checked><label for="lo">Kichik harflar (a-z)</label></div>
      <div class="check"><input id="up" type="checkbox" checked><label for="up">Katta harflar (A-Z)</label></div>
      <div class="check"><input id="nu" type="checkbox" checked><label for="nu">Raqamlar (0-9)</label></div>
      <div class="check"><input id="sy" type="checkbox" checked><label for="sy">Belgilar (!@#$%...)</label></div>
      <div class="check"><input id="am" type="checkbox"><label for="am">O‘xshash belgilarni chiqarib tashlash (0, O, l, 1, I)</label></div>
      <div class="row" style="margin-top:14px"><button class="btn" id="gen" type="button">Yangi parol</button><button class="btn ghost" id="copy" type="button">Nusxalash</button></div>
      <p id="err" class="msg-err" role="alert"></p>
      <p class="muted">Parol brauzeringizda xavfsiz tasodifiy generator bilan yaratiladi va hech qayerga yuborilmaydi.</p>
    </div>
    <div id="related" class="related"></div>
  </main>
  <script src="../assets/app.js"></script>
  <script>
  (function () {
    var $ = function (id) { return document.getElementById(id); };
    function rnd(n) { var a = new Uint32Array(1), lim = Math.floor(4294967296 / n) * n; do { crypto.getRandomValues(a); } while (a[0] >= lim); return a[0] % n; }
    function gen() {
      var sets = [];
      if ($('lo').checked) sets.push('abcdefghijklmnopqrstuvwxyz');
      if ($('up').checked) sets.push('ABCDEFGHIJKLMNOPQRSTUVWXYZ');
      if ($('nu').checked) sets.push('0123456789');
      if ($('sy').checked) sets.push('!@#$%^&*()-_=+[]{};:,.?');
      $('err').textContent = '';
      if (!sets.length) { $('err').textContent = 'Kamida bitta belgi turini tanlang.'; $('pw').textContent = ''; return; }
      if ($('am').checked) sets = sets.map(function (s) { return s.replace(/[0OlI1o]/g, ''); });
      var len = parseInt($('len').value, 10), all = sets.join(''), out = [];
      sets.forEach(function (s) { out.push(s[rnd(s.length)]); });
      while (out.length < len) out.push(all[rnd(all.length)]);
      for (var i = out.length - 1; i > 0; i--) { var j = rnd(i + 1), t = out[i]; out[i] = out[j]; out[j] = t; }
      out = out.slice(0, len);
      $('pw').textContent = out.join('');
      var bits = len * Math.log2(all.length), lvl = bits < 40 ? ['Zaif', '#ff6b6b', 25] : bits < 60 ? ['O‘rtacha', '#f5b82e', 50] : bits < 90 ? ['Yaxshi', '#9be15d', 75] : ['Juda kuchli', '#4ade80', 100];
      $('mt').style.width = lvl[2] + '%'; $('mt').style.background = lvl[1];
      $('strength').textContent = 'Mustahkamlik: ' + lvl[0] + ' (taxminan ' + Math.round(bits) + ' bit entropiya)';
    }
    $('len').addEventListener('input', function () { $('lv').textContent = this.value; gen(); });
    ['lo', 'up', 'nu', 'sy', 'am'].forEach(function (id) { $(id).addEventListener('change', gen); });
    $('gen').addEventListener('click', gen);
    $('copy').addEventListener('click', function () { if ($('pw').textContent) TO.copyText($('pw').textContent); });
    gen();
  })();
  </script>
</body>
</html>
